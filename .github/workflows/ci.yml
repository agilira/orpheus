name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CGO_ENABLED: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Install Dependencies
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
        go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Verify Dependencies
      run: go mod verify

    - name: Vulnerability Check
      run: govulncheck ./...

    - name: Go Format Check
      run: |
        if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
          echo "Code not formatted:"
          gofmt -l .
          exit 1
        fi

    - name: Go Vet
      run: go vet ./...

    - name: Staticcheck
      run: staticcheck ./...

    - name: Security Scan (gosec)
      # Informational here; pr.yml gates on the same config. continue-on-error
      # already keeps a finding from failing the job, so the step reports its
      # real exit status instead of swallowing it with "|| true" -- which, with
      # .gosec.json missing, made this step succeed without ever scanning.
      continue-on-error: true
      run: gosec -conf .gosec.json ./...

    - name: Test with Race Detection
      run: go test -race -timeout 5m -v ./...

    - name: Test Coverage
      run: |
        go test -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build Matrix
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['stable']  # Reduced to save minutes
        include:
          - os: macos-latest
            timeout: 5  # Shorter timeout for macOS due to runner availability issues
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Build
      run: go build -v ./...
      timeout-minutes: ${{ matrix.timeout || 15 }}

    - name: Short Test (no race, faster)
      run: go test -short -timeout 5m ./...
      timeout-minutes: ${{ matrix.timeout || 15 }}

  # The root module is only part of the repository. The examples and the
  # benchmarks are separate modules that "go build ./..." never reaches, so
  # they drifted until none of them built: Dependabot bumped the root go.mod
  # and left them asking for "go mod tidy". This job keeps them honest.
  #
  # go vet and go test rather than go build: examples/storage/providers is a
  # plugin, built with -buildmode=plugin, and has no main function.
  submodules:
    name: Submodules
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Vet and test every submodule
      run: |
        set -euo pipefail
        status=0
        for mod in $(find . -mindepth 2 -name go.mod | sort); do
          dir=$(dirname "$mod")
          echo "::group::$dir"
          (cd "$dir" && go vet ./... && go test -count=1 -timeout 5m ./...) || status=1
          echo "::endgroup::"
        done
        exit $status
