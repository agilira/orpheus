coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 10%
        informational: true
    patch:
      default:
        target: auto
        threshold: 10%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default

ignore:
  - "**/*_test.go"
  - "internal/apicheck/**"
  - "examples/**"
  - "benchmarks/**"
